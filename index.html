<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Turbine Digital Twin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}

body{
  background:#0a0d12;
  color:#cdd8e8;
  font-family:"Courier New",monospace;
  overflow:hidden;
}
#c{position:fixed;inset:0;display:block;}

/* ── LABEL LAYER ── */
#ll{
  position:fixed;inset:0;z-index:10;
  pointer-events:none;overflow:hidden;
}

/* ── BEARING TAG ── */
.tag{
  position:absolute;
  display:none;
  pointer-events:none;
  flex-direction:column;
  align-items:center;
  transform:translate(-50%,-100%);
}
.tag.below{
  transform:translate(-50%,0%);
  flex-direction:column-reverse;
}

.tag-card{
  background:rgba(7,10,17,0.97);
  border:1px solid #00c8ff;
  border-radius:5px;
  padding:6px 9px;
  min-width:118px;
  font-size:9.5px;
  line-height:1;
  backdrop-filter:blur(6px);
}
.tag.warn  .tag-card{border-color:#ffb300;}
.tag.alert .tag-card{border-color:#ff3d3d;}

.tc-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-bottom:5px;
  padding-bottom:4px;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.tc-id{font-size:11px;font-weight:bold;color:#00c8ff;letter-spacing:0.04em;}
.tag.warn  .tc-id{color:#ffb300;}
.tag.alert .tc-id{color:#ff3d3d;}
.tc-sec{font-size:8px;color:#1e3855;letter-spacing:0.06em;}

.tc-rows{display:flex;flex-direction:column;gap:3px;}
.tc-row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.tc-div{height:1px;background:rgba(255,255,255,0.05);margin:2px 0;}

.tl{color:#2a4a68;font-size:8.5px;white-space:nowrap;}
.tv{font-weight:bold;font-size:10px;white-space:nowrap;}
.tv.ok   {color:#00e676;}
.tv.warn {color:#ffb300;}
.tv.alert{color:#ff3d3d;}
.tv.dim  {color:#1e3855;}
.tu{color:#1e3855;font-size:8px;margin-left:1px;}

/* stem */
.tag-line{
  width:1px;height:22px;
  background:linear-gradient(to bottom,#00c8ff,transparent);
}
.tag.warn  .tag-line{background:linear-gradient(to bottom,#ffb300,transparent);}
.tag.alert .tag-line{background:linear-gradient(to bottom,#ff3d3d,transparent);}
.tag.below .tag-line{background:linear-gradient(to top,#00c8ff,transparent);}
.tag.below.warn  .tag-line{background:linear-gradient(to top,#ffb300,transparent);}
.tag.below.alert .tag-line{background:linear-gradient(to top,#ff3d3d,transparent);}

.tag-dot{width:6px;height:6px;border-radius:50%;background:#00c8ff;flex-shrink:0;}
.tag.warn  .tag-dot{background:#ffb300;}
.tag.alert .tag-dot{background:#ff3d3d;}

/* ── MACHINE PANEL — fixed top-left ── */
#machine-panel{
  position:fixed;
  top:54px;left:14px;
  z-index:20;
  display:none;
  background:rgba(7,10,17,0.97);
  border:1px solid #1e3a5a;
  border-radius:5px;
  padding:8px 10px;
  font-size:9px;
  min-width:200px;
  backdrop-filter:blur(6px);
  pointer-events:none;
  max-height:calc(100vh - 80px);
  overflow-y:auto;
}
.mp-title{
  font-size:10px;font-weight:bold;
  color:#2a5070;letter-spacing:0.12em;
  margin-bottom:6px;padding-bottom:4px;
  border-bottom:1px solid rgba(255,255,255,0.05);
}
.mp-sec-head{
  font-size:8px;color:#1e3855;
  letter-spacing:0.12em;
  margin:6px 0 3px;
  text-transform:uppercase;
}
.mp-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:1px 0;
}

/* ── TOP BAR ── */
#bar{
  position:fixed;top:0;left:0;right:0;
  height:46px;z-index:100;
  background:#0d1117;
  border-bottom:1px solid #1e2d45;
  display:flex;align-items:center;
  padding:0 14px;gap:10px;
}
.logo{color:#00c8ff;font-weight:bold;font-size:13px;margin-right:6px;white-space:nowrap;}
.pill{
  background:#111622;border:1px solid #1e2d45;
  border-radius:20px;padding:3px 10px;
  font-size:9px;color:#4a6080;white-space:nowrap;
}
.pill b     {color:#cdd8e8;}
.pill b.ok  {color:#00e676;}
.pill b.warn{color:#ffb300;}
.pill b.alert{color:#ff3d3d;}

/* ── LOADING ── */
#hint{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  z-index:20;text-align:center;pointer-events:none;
}
#hint .hb{
  background:rgba(17,22,34,0.9);
  border:1px dashed #1e2d45;
  border-radius:8px;padding:24px 36px;display:inline-block;
}
#hint h2{color:#00c8ff;font-size:14px;margin-bottom:10px;}
#hint p {color:#4a6080;font-size:10px;line-height:2;}

/* ── CONTROLS ── */
#ctrls{
  position:fixed;bottom:16px;right:16px;
  z-index:100;display:flex;flex-direction:column;gap:6px;
}
.cb{
  width:34px;height:34px;
  background:rgba(13,17,23,0.95);
  border:1px solid #1e2d45;border-radius:5px;
  color:#cdd8e8;font-size:14px;cursor:pointer;
}
.cb:hover{border-color:#00c8ff;}
.cb.active{border-color:#00c8ff;background:rgba(0,200,255,0.15);color:#00c8ff;}

/* ── EDIT MODE ── */
body.editmode #ll{pointer-events:auto;}
body.editmode .tag{pointer-events:auto;cursor:grab;display:flex!important;}
body.editmode .tag:active{cursor:grabbing;}
body.editmode .tag-card{border-style:dashed;}

#editBanner{
  display:none;
  position:fixed;top:46px;left:0;right:0;z-index:90;
  background:rgba(0,200,255,0.1);
  border-bottom:1px solid rgba(0,200,255,0.4);
  padding:4px 14px;font-size:10px;color:#00c8ff;
  text-align:center;letter-spacing:0.1em;
}
body.editmode #editBanner{display:block;}

/* ── AR ── */
#arTap{
  display:none;position:fixed;bottom:100px;left:50%;
  transform:translateX(-50%);z-index:200;
  background:rgba(0,200,255,0.18);border:1px solid #00c8ff;
  color:#00c8ff;border-radius:24px;padding:12px 28px;
  font-size:13px;font-family:"Courier New",monospace;font-weight:bold;
  cursor:pointer;pointer-events:auto;white-space:nowrap;
  box-shadow:0 0 20px rgba(0,200,255,0.12);
}
#arTap:hover{background:rgba(0,200,255,0.28);}
#arExit{
  display:none;position:fixed;top:10px;right:10px;z-index:200;
  background:rgba(255,61,61,0.2);border:1px solid #ff3d3d;
  color:#ff3d3d;border-radius:4px;padding:8px 16px;
  font-size:12px;font-family:"Courier New",monospace;cursor:pointer;
}

/* ── STATUS ── */
#status{
  position:fixed;left:50%;bottom:16px;
  transform:translateX(-50%);
  z-index:150;
  background:rgba(13,17,23,.94);
  border:1px solid #1e2d45;border-radius:5px;
  padding:7px 12px;font-size:10px;color:#4a6080;
  display:none;pointer-events:none;
  max-width:90vw;text-align:center;
}

/* ── MOBILE ── */
@media(max-width:700px){
  #bar{padding:0 8px;gap:5px;}
  .logo{font-size:10px;margin-right:2px;}
  .pill{padding:3px 6px;font-size:8px;}
  #ctrls{bottom:12px;right:12px;}
  .cb{width:38px;height:38px;}
  #machine-panel{min-width:160px;font-size:8px;}
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="bar">
  <div class="logo">⚙ TURBINE TWIN</div>
  <button id="bAR" style="margin-left:auto;background:#00e676;color:#000;border:none;
    border-radius:4px;padding:6px 14px;font-family:Courier New,monospace;
    font-size:11px;font-weight:bold;cursor:pointer;display:none;">📷 START AR</button>
  <div class="pill">ALERTS <b id="hA">—</b></div>
  <div class="pill">MAX VIB <b id="hV">—</b></div>
  <div class="pill">THRUST <b id="hT">—</b></div>
  <div class="pill">REFRESH <b id="hR">10s</b></div>
  <div class="pill" id="hFreeze">🔴 <b class="ok">LIVE</b></div>
</div>

<canvas id="c"></canvas>
<button id="arTap">👆 TAP TO PLACE TURBINE</button>
<button id="arExit">✕ EXIT AR</button>

<!-- LABEL LAYER — 7 bearing tags injected here by JS -->
<div id="ll"></div>

<!-- MACHINE PANEL — top-left fixed HUD, content built by JS -->
<div id="machine-panel"></div>

<div id="status"></div>

<div id="hint">
  <div class="hb">
    <h2>Loading Turbine Digital Twin…</h2>
    <p>Connecting to 3D model and live Google Sheet data<br>
    <span style="color:#1e2d45">———</span><br>Please wait</p>
  </div>
</div>

<div id="editBanner">
  ✥ EDIT MODE — drag tags to reposition · 💾 to export · click Edit to exit
</div>

<div id="ctrls">
  <button class="cb" id="bReset" title="Reset camera">⌖</button>
  <button class="cb" id="bLabel" title="Toggle all panels">🏷</button>
  <button class="cb" id="bWire"  title="Wireframe">⬡</button>
  <button class="cb" id="bEdit"  title="Edit tag positions">✥</button>
  <button class="cb" id="bSave"  title="Export positions">💾</button>
  <button class="cb" id="bFreeze" title="Freeze/unfreeze data">❄</button>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"}}
</script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
